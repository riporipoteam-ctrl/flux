[build]
  command = "npm run build"
  publish = ".next"

# Firebase's web configuration is public client configuration. Keeping it here
# makes Netlify builds self-contained while secrets such as GROQ_API_KEY stay
# in Netlify's environment settings and are never committed.
[build.environment]
  NEXT_PUBLIC_FIREBASE_API_KEY = "AIzaSyBV_ev8AVpKwgioPSSWiBYf8UU09bLbWOU"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = "flux-544a6.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID = "flux-544a6"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET = "flux-544a6.firebasestorage.app"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "475310930388"
  NEXT_PUBLIC_FIREBASE_APP_ID = "1:475310930388:web:b6dfe7518bb06d5e01be41"
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID = "G-SMS9G4W1ZV"

[[plugins]]
  package = "@netlify/plugin-nextjs"

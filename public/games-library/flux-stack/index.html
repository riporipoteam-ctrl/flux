<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Flux Stack</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070716;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;padding:max(14px,env(safe-area-inset-top)) 16px;pointer-events:none;display:flex;justify-content:space-between}.brand{font-size:12px;font-weight:950;letter-spacing:.18em}.brand small{display:block;color:#c084fc;font-size:9px;margin-top:4px}.score{text-align:right}.score b{font-size:30px}.score small{display:block;color:#94a3b8}.drop{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(82vw,360px);height:74px;border:1px solid #ffffff35;border-radius:999px;background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;font-size:18px;font-weight:950;z-index:2}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 38%,#4c1d9599,#080816ef 68%);z-index:5}.card{text-align:center;max-width:420px}.card h1{margin:0;font-size:54px;line-height:.88;letter-spacing:-.06em}.card p{color:#e9d5ff;line-height:1.6}.card button{border:0;border-radius:999px;padding:16px 30px;background:#fff;color:#581c87;font-weight:950}.hidden{display:none}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="brand">FLUX STACK<small>2D CITY BUILDER</small></div><div class="score"><b id="score">0</b><small>FLOORS</small></div></div><button class="drop" id="drop">DROP BLOCK</button><div class="overlay" id="overlay"><div class="card"><h1 id="title">FLUX<br>STACK</h1><p id="copy">Time each drop, trim the overhang and build the tallest neon tower you can.</p><button id="start">BUILD</button></div></div><script>const c=document.querySelector('#game'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),title=document.querySelector('#title'),copy=document.querySelector('#copy'),start=document.querySelector('#start'),drop=document.querySelector('#drop');let w=0,h=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);let blocks=[],current=null,running=false,score=0,speed=3.5,dir=1,cameraY=0,last=performance.now();function reset(){score=0;speed=3.5;cameraY=0;blocks=[{x:w/2-95,y:h-145,w:190,h:28,color:'#312e81'}];current={x:20,y:h-205,w:190,h:28,color:'#8b5cf6'};scoreEl.textContent='0'}start.onclick=()=>{reset();running=true;overlay.classList.add('hidden')};function makeNext(){const base=blocks.at(-1);const y=base.y-58;current={x:dir>0?20:w-base.w-20,y,w:base.w,h:28,color:`hsl(${(score*43+260)%360} 78% 58%)`};speed=Math.min(9,3.5+score*.14)}function place(){if(!running||!current)return;const base=blocks.at(-1),left=Math.max(current.x,base.x),right=Math.min(current.x+current.w,base.x+base.w),overlap=right-left;if(overlap<8){end();return}const cut=current.w-overlap;if(cut>2){const fromLeft=current.x<base.x;pieces.push({x:fromLeft?current.x:right,y:current.y,w:cut,h:current.h,vy:0,rot:0,color:current.color})}current.x=left;current.w=overlap;blocks.push(current);score++;scoreEl.textContent=score;if(blocks.at(-1).y-cameraY<h*.34)cameraY-=58;dir*=-1;makeNext()}drop.addEventListener('pointerdown',e=>{e.preventDefault();place()});addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')place()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();place()}});function end(){running=false;title.innerHTML='TOWER<br>FELL';copy.textContent=`${score} floors stacked. Build again and push the skyline higher.`;start.textContent='REBUILD';overlay.classList.remove('hidden')}const pieces=[];function background(){const bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#070716');bg.addColorStop(.55,'#1e1b4b');bg.addColorStop(1,'#05050d');g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle='#ffffff0c';for(let i=0;i<40;i++){const sx=(i*83)%w,sy=(i*151)%h;g.fillRect(sx,sy,2,2)}const glow=g.createRadialGradient(w/2,h*.7,20,w/2,h*.7,w*.5);glow.addColorStop(0,'#c026d355');glow.addColorStop(1,'#0000');g.fillStyle=glow;g.fillRect(0,0,w,h)}function block(b){const y=b.y-cameraY;const grad=g.createLinearGradient(b.x,y,b.x+b.w,y);grad.addColorStop(0,b.color);grad.addColorStop(1,'#22d3ee');g.fillStyle=grad;g.shadowColor=b.color;g.shadowBlur=18;g.fillRect(b.x,y,b.w,b.h);g.shadowBlur=0;g.fillStyle='#ffffff35';g.fillRect(b.x,y,b.w,3)}function loop(now){requestAnimationFrame(loop);const dt=Math.min(2,(now-last)/16.67);last=now;background();if(running&&current){current.x+=dir*speed*dt;if(current.x<=12){current.x=12;dir=1}if(current.x+current.w>=w-12){current.x=w-12-current.w;dir=-1}}for(const b of blocks)block(b);if(current)block(current);for(const p of pieces){p.vy+=.6*dt;p.y+=p.vy*dt;p.rot+=.04*dt;g.save();g.translate(p.x+p.w/2,p.y-cameraY+p.h/2);g.rotate(p.rot);g.fillStyle=p.color;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()}for(let i=pieces.length-1;i>=0;i--)if(pieces[i].y-cameraY>h+100)pieces.splice(i,1);g.fillStyle='#ffffffaa';g.font='800 12px system-ui';g.textAlign='center';g.fillText('PERFECT DROPS KEEP THE FULL WIDTH',w/2,h-112)}requestAnimationFrame(loop);</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Flux</title>
  <style>
    html,body{margin:0;height:100%;background:#0a0a0c;color:#fff;font-family:system-ui,sans-serif}
    .box{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
    a{color:#1d9bf0;font-weight:700}
  </style>
  <script>
    // If Capacitor loads webDir only (no server.url), bounce to game once host is known
    // Prefer same origin /game when served from Next/Firebase
    if (location.protocol !== 'file:') {
      location.replace('/game?app=1');
    }
  </script>
</head>
<body>
  <div class="box">
    <h1>Flux</h1>
    <p>Mobile client · Firebase multiplayer · no PC required</p>
    <p>Open the app via production URL, or set <code>NEXT_PUBLIC_APP_URL</code> in Capacitor.</p>
    <p><a href="/game?app=1">Enter Hangout</a></p>
  </div>
</body>
</html>

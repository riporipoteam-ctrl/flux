<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Flux Orbit</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:white;font-family:Inter,system-ui,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;padding:max(15px,env(safe-area-inset-top)) 15px 18px;pointer-events:none}.row{display:flex;justify-content:space-between}.logo{font-size:13px;font-weight:950;letter-spacing:.18em}.logo small{display:block;color:#818cf8;font-size:9px;margin-top:4px}.stats{text-align:right;font-weight:900}.stats b{font-size:28px}.stats small{display:block;color:#94a3b8}.stick{position:fixed;left:22px;bottom:max(22px,env(safe-area-inset-bottom));width:118px;height:118px;border:1px solid #ffffff28;border-radius:50%;background:#11182799;backdrop-filter:blur(12px);z-index:2}.nub{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 0 30px #818cf8}.pulse{position:fixed;right:22px;bottom:max(36px,env(safe-area-inset-bottom));width:84px;height:84px;border:0;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#22d3ee);color:#fff;font-size:26px;font-weight:900;z-index:2}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 35%,#312e8199,#020617ed 65%);z-index:5}.card{max-width:430px;text-align:center}.card h1{font-size:54px;line-height:.88;letter-spacing:-.065em;margin:0}.card p{color:#cbd5e1;line-height:1.65}.card button{padding:16px 30px;border:0;border-radius:999px;background:#fff;color:#0f172a;font-weight:950}.hidden{display:none}</style></head><body><div class="hud"><div class="row"><div class="logo">FLUX ORBIT<small>3D SPACE RUN</small></div><div class="stats"><b id="score">0</b><small>ENERGY</small></div></div></div><div class="stick" id="stick"><div class="nub" id="nub"></div></div><button class="pulse" id="pulse" aria-label="Pulse shield">◎</button><div class="overlay" id="overlay"><div class="card"><h1 id="title">FLUX<br>ORBIT</h1><p id="copy">Pilot through a collapsing energy field. Drag the left control to steer. Use pulse to destroy nearby debris.</p><button id="start">LAUNCH</button></div></div><script type="module">import * as THREE from '../anti-gravity-pool/js/three.module.min.js';const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02030a,.028);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,250);camera.position.set(0,2.2,9);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x02030a);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0x818cf8,0x02030a,2.3));const light=new THREE.PointLight(0x22d3ee,45,70);light.position.set(0,8,8);scene.add(light);const ship=new THREE.Group();const hull=new THREE.Mesh(new THREE.ConeGeometry(.72,2.2,5),new THREE.MeshStandardMaterial({color:0x8b5cf6,metalness:.8,roughness:.2,emissive:0x20104d}));hull.rotation.x=-Math.PI/2;ship.add(hull);const wingMat=new THREE.MeshStandardMaterial({color:0x22d3ee,metalness:.7,roughness:.15});for(const s of[-1,1]){const wing=new THREE.Mesh(new THREE.BoxGeometry(1.25,.12,.65),wingMat);wing.position.set(s*.72,0,.28);wing.rotation.z=s*.18;ship.add(wing)}ship.position.z=3;scene.add(ship);const starGeo=new THREE.BufferGeometry();const pts=[];for(let i=0;i<800;i++)pts.push((Math.random()-.5)*70,(Math.random()-.5)*45,-Math.random()*180);starGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:.08}));scene.add(stars);const debris=[],orbs=[];function debrisOne(z){const g=[new THREE.DodecahedronGeometry(.65+Math.random()*.85),new THREE.IcosahedronGeometry(.6+Math.random()*.7)][Math.floor(Math.random()*2)];const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x475569,roughness:.8,metalness:.25}));m.position.set((Math.random()-.5)*10,(Math.random()-.5)*7,z);m.userData.spin=(Math.random()-.5)*.04;scene.add(m);debris.push(m)}function orbOne(z){const m=new THREE.Mesh(new THREE.TorusKnotGeometry(.32,.1,48,8),new THREE.MeshBasicMaterial({color:0x67e8f9}));m.position.set((Math.random()-.5)*9,(Math.random()-.5)*6,z);scene.add(m);orbs.push(m)}for(let i=0;i<28;i++)debrisOne(-15-i*6-Math.random()*8);for(let i=0;i<16;i++)orbOne(-12-i*10-Math.random()*8);let running=false,score=0,speed=.52,last=performance.now(),target={x:0,y:0},shield=0,dead=false;const overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),title=document.querySelector('#title'),copy=document.querySelector('#copy'),start=document.querySelector('#start'),stick=document.querySelector('#stick'),nub=document.querySelector('#nub');function reset(){score=0;speed=.52;ship.position.set(0,0,3);target={x:0,y:0};shield=0;dead=false;for(const d of debris){d.position.z=-15-Math.random()*170;d.position.x=(Math.random()-.5)*10;d.position.y=(Math.random()-.5)*7}for(const o of orbs){o.position.z=-12-Math.random()*170;o.position.x=(Math.random()-.5)*9;o.position.y=(Math.random()-.5)*6}scoreEl.textContent='0'}start.onclick=()=>{reset();running=true;overlay.classList.add('hidden')};function end(){running=false;dead=true;title.innerHTML='MISSION<br>ENDED';copy.textContent=`You collected ${Math.floor(score)} energy. Launch again and beat the run.`;start.textContent='RELAUNCH';overlay.classList.remove('hidden')}let pointer=null;function moveStick(e){if(pointer!==e.pointerId)return;const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy)||1,max=38,k=Math.min(1,max/len);const x=dx*k,y=dy*k;nub.style.transform=`translate(${x}px,${y}px)`;target.x=x/max*4.5;target.y=-y/max*3.1}stick.onpointerdown=e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e)};stick.onpointermove=moveStick;stick.onpointerup=()=>{pointer=null;nub.style.transform='translate(0,0)';target.x=0;target.y=0};document.querySelector('#pulse').onpointerdown=e=>{e.preventDefault();if(shield>0)return;shield=.85;for(const d of debris){if(d.position.z>-2&&d.position.z<8&&Math.hypot(d.position.x-ship.position.x,d.position.y-ship.position.y)<4){d.position.z=-150-Math.random()*25;score+=8}}};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')target.x=-4;if(e.key==='ArrowRight')target.x=4;if(e.key==='ArrowUp')target.y=3;if(e.key==='ArrowDown')target.y=-3;if(e.key===' ')document.querySelector('#pulse').click()});addEventListener('keyup',()=>{target.x=0;target.y=0});function animate(now){requestAnimationFrame(animate);const dt=Math.min(.035,(now-last)/1000);last=now;if(running){speed=Math.min(1.35,speed+dt*.012);score+=dt*speed*2;scoreEl.textContent=Math.floor(score);ship.position.x+=(target.x-ship.position.x)*dt*5;ship.position.y+=(target.y-ship.position.y)*dt*5;ship.rotation.z+=(target.x*.08-ship.rotation.z)*dt*5;ship.rotation.x+=(target.y*.04-ship.rotation.x)*dt*5;shield=Math.max(0,shield-dt);ship.scale.setScalar(1+Math.sin(now*.03)*shield*.15);const pos=stars.geometry.attributes.position;for(let i=2;i<pos.array.length;i+=3){pos.array[i]+=speed*1.5;if(pos.array[i]>8)pos.array[i]=-180}pos.needsUpdate=true;for(const d of debris){d.position.z+=speed;d.rotation.x+=d.userData.spin;d.rotation.y+=d.userData.spin*.8;if(d.position.z>10){d.position.z=-150-Math.random()*30;d.position.x=(Math.random()-.5)*10;d.position.y=(Math.random()-.5)*7}if(Math.abs(d.position.z-ship.position.z)<1.25&&Math.hypot(d.position.x-ship.position.x,d.position.y-ship.position.y)<1.15){if(shield>0)d.position.z=-160;else end()}}for(const o of orbs){o.position.z+=speed;o.rotation.x+=dt*2;o.rotation.y+=dt*2.5;if(o.position.z>10){o.position.z=-150-Math.random()*25;o.position.x=(Math.random()-.5)*9;o.position.y=(Math.random()-.5)*6}if(Math.abs(o.position.z-ship.position.z)<1.2&&Math.hypot(o.position.x-ship.position.x,o.position.y-ship.position.y)<1){score+=25;o.position.z=-165-Math.random()*15}}camera.position.x+=(ship.position.x*.12-camera.position.x)*dt*3;camera.position.y+=(2.2+ship.position.y*.1-camera.position.y)*dt*3}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>

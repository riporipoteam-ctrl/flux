<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Flux Rooftop</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f;color:white;font-family:Inter,system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;padding:max(14px,env(safe-area-inset-top)) 16px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:12px;font-weight:950;letter-spacing:.18em}.brand small{display:block;color:#38bdf8;font-size:9px;margin-top:4px}.score{text-align:right}.score b{font-size:30px}.score small{display:block;color:#94a3b8}.jump{position:fixed;right:22px;bottom:max(24px,env(safe-area-inset-bottom));width:94px;height:94px;border-radius:32px;border:1px solid #ffffff35;background:#0ea5e9d9;color:white;font-size:17px;font-weight:950;z-index:2}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(#08111f88,#020617ed);z-index:4}.card{text-align:center;max-width:420px}.card h1{margin:0;font-size:52px;line-height:.9;letter-spacing:-.06em}.card p{color:#cbd5e1;line-height:1.6}.card button{border:0;border-radius:999px;padding:16px 30px;background:#fff;color:#0f172a;font-weight:950}.hidden{display:none}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="brand">FLUX ROOFTOP<small>2D PARKOUR</small></div><div class="score"><b id="score">0</b><small>METERS</small></div></div><button class="jump" id="jump">JUMP</button><div class="overlay" id="overlay"><div class="card"><h1 id="title">FLUX<br>ROOFTOP</h1><p id="copy">Run across the skyline, clear gaps, grab energy and chain double jumps. Tap anywhere or use the jump button.</p><button id="start">START RUN</button></div></div><script>const c=document.querySelector('#game'),x=c.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),title=document.querySelector('#title'),copy=document.querySelector('#copy'),start=document.querySelector('#start');let w=0,h=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);const player={x:110,y:0,vy:0,r:18,jumps:0};let platforms=[],orbs=[],running=false,score=0,speed=6,last=performance.now();function reset(){score=0;speed=6;platforms=[];orbs=[];const base=h*.73;let px=-40;for(let i=0;i<14;i++){const width=150+Math.random()*180;platforms.push({x:px,y:base-Math.random()*90,w:width,h:Math.max(120,h-base+100)});if(i>0&&Math.random()>.35)orbs.push({x:px+width*.55,y:platforms.at(-1).y-48,r:9,hit:false});px+=width+70+Math.random()*105}player.y=platforms[0].y-player.r;player.vy=0;player.jumps=0;scoreEl.textContent='0'}function begin(){reset();running=true;overlay.classList.add('hidden')}start.onclick=begin;function jump(){if(!running)return;if(player.jumps<2){player.vy=-12.5-(player.jumps===0?0:1.2);player.jumps++}}document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')jump()});addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp')jump()});function end(){running=false;title.innerHTML='RUN<br>OVER';copy.textContent=`${Math.floor(score)} meters. Tap below to try the skyline again.`;start.textContent='RUN AGAIN';overlay.classList.remove('hidden')}function step(now){requestAnimationFrame(step);const dt=Math.min(2,(now-last)/16.67);last=now;x.clearRect(0,0,w,h);const sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#0f172a');sky.addColorStop(.52,'#1e3a8a');sky.addColorStop(1,'#0f172a');x.fillStyle=sky;x.fillRect(0,0,w,h);x.fillStyle='#ffffff10';for(let i=0;i<25;i++){const sx=((i*173-score*.25)%(w+120))-60,sy=40+(i*97)%(h*.45);x.fillRect(sx,sy,2,2)}x.fillStyle='#0b1220';for(let i=0;i<12;i++){const bx=((i*210-score*.42)%(w+260))-120,bh=90+(i*37)%180;x.fillRect(bx,h*.68-bh,150,bh+180)}if(running){score+=speed*.08*dt;speed=Math.min(11.5,speed+.0015*dt);scoreEl.textContent=Math.floor(score);player.vy+=.66*dt;player.y+=player.vy*dt;for(const p of platforms)p.x-=speed*dt;for(const o of orbs)o.x-=speed*dt;let grounded=false;for(const p of platforms){const wasBottom=player.y+player.r-player.vy*dt;const bottom=player.y+player.r;if(player.x+player.r>p.x&&player.x-player.r<p.x+p.w&&wasBottom<=p.y+5&&bottom>=p.y&&player.vy>=0){player.y=p.y-player.r;player.vy=0;player.jumps=0;grounded=true}}for(const o of orbs){if(!o.hit&&Math.hypot(o.x-player.x,o.y-player.y)<player.r+o.r){o.hit=true;score+=25}}const lastP=platforms.at(-1);if(lastP.x+lastP.w<w+500){const gap=70+Math.random()*120,width=150+Math.random()*220;const np={x:lastP.x+lastP.w+gap,y:h*.73-Math.random()*100,w:width,h:240};platforms.push(np);if(Math.random()>.3)orbs.push({x:np.x+width*.5,y:np.y-48,r:9,hit:false})}while(platforms[0]&&platforms[0].x+platforms[0].w<-80)platforms.shift();while(orbs[0]&&orbs[0].x<-80)orbs.shift();if(player.y>h+80)end()}for(const p of platforms){const g=x.createLinearGradient(0,p.y,0,h);g.addColorStop(0,'#182235');g.addColorStop(1,'#050814');x.fillStyle=g;x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#38bdf8';x.fillRect(p.x,p.y,p.w,5)}for(const o of orbs)if(!o.hit){x.beginPath();x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fillStyle='#facc15';x.shadowColor='#fde047';x.shadowBlur=20;x.fill();x.shadowBlur=0}x.save();x.translate(player.x,player.y);x.rotate(Math.max(-.25,Math.min(.25,player.vy*.025)));x.fillStyle='#f8fafc';x.beginPath();x.roundRect(-15,-19,30,38,10);x.fill();x.fillStyle='#0ea5e9';x.fillRect(-13,-5,26,8);x.fillStyle='#111827';x.beginPath();x.arc(7,-8,3,0,Math.PI*2);x.fill();x.restore()}requestAnimationFrame(step);</script></body></html>

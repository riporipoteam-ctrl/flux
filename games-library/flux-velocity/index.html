<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Flux Velocity</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 16px 16px}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:13px;font-weight:900;letter-spacing:.18em}.score{text-align:right}.score strong{display:block;font-size:30px;line-height:1}.score span,.brand span{font-size:10px;color:#94a3b8}.controls{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.controls button{pointer-events:auto;width:82px;height:82px;border:1px solid #ffffff38;border-radius:28px;background:#0f172acc;color:#fff;font-size:30px;font-weight:900;backdrop-filter:blur(14px)}.controls .boost{width:92px;background:#06b6d4cc}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(#02061799,#020617e8);z-index:4}.card{max-width:420px;text-align:center}.card h1{font-size:48px;line-height:.9;margin:0;font-weight:950;letter-spacing:-.06em}.card p{color:#cbd5e1;line-height:1.6}.card button{border:0;border-radius:999px;background:#fff;color:#020617;font-weight:900;padding:16px 30px;font-size:16px}.hidden{display:none}.flash{position:fixed;inset:0;background:#ef4444;opacity:0;pointer-events:none;transition:.15s}.flash.on{opacity:.35}</style></head><body><div class="hud"><div class="top"><div class="brand">FLUX VELOCITY<br><span>3D ORIGINAL</span></div><div class="score"><strong id="score">0</strong><span>METERS</span></div></div></div><div class="controls"><button id="left" aria-label="Steer left">←</button><button class="boost" id="boost" aria-label="Boost">⚡</button><button id="right" aria-label="Steer right">→</button></div><div id="overlay" class="overlay"><div class="card"><h1 id="title">FLUX<br>VELOCITY</h1><p id="copy">Dodge traffic, collect energy and survive the neon highway. Drag anywhere or use the touch controls.</p><button id="start">START RACE</button></div></div><div id="flash" class="flash"></div><script type="module">import * as THREE from '../anti-gravity-pool/js/three.module.min.js';const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x020617,18,110);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,200);camera.position.set(0,5.2,8.5);camera.rotation.x=-.48;const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x020617);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0x67e8f9,0x020617,2.4));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(4,10,5);scene.add(sun);const road=new THREE.Group();scene.add(road);for(let i=0;i<34;i++){const tile=new THREE.Mesh(new THREE.BoxGeometry(9,.14,3),new THREE.MeshStandardMaterial({color:i%2?0x0b1220:0x111827,roughness:.8,metalness:.15}));tile.position.z=-i*3;road.add(tile);for(const x of[-3,0,3]){const line=new THREE.Mesh(new THREE.BoxGeometry(.08,.03,1.35),new THREE.MeshBasicMaterial({color:x===0?0x22d3ee:0x475569}));line.position.set(x,.1,tile.position.z);road.add(line)}}const car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1.25,.45,2.1),new THREE.MeshStandardMaterial({color:0x06b6d4,metalness:.75,roughness:.18}));body.position.y=.55;car.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(.85,.38,.85),new THREE.MeshStandardMaterial({color:0x0f172a,metalness:.7,roughness:.1}));cabin.position.set(0,.91,.05);car.add(cabin);car.position.z=2.3;scene.add(car);const obstacles=[];const energies=[];function makeObstacle(z,lane){const m=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.2,2),new THREE.MeshStandardMaterial({color:[0xf97316,0xef4444,0xa855f7][Math.floor(Math.random()*3)],metalness:.35,roughness:.35}));m.position.set(lane*2.7,.68,z);scene.add(m);obstacles.push(m)}function makeEnergy(z,lane){const m=new THREE.Mesh(new THREE.TorusGeometry(.34,.11,10,24),new THREE.MeshBasicMaterial({color:0x67e8f9}));m.rotation.x=Math.PI/2;m.position.set(lane*2.7,.9,z);scene.add(m);energies.push(m)}for(let z=-20;z>-115;z-=8+Math.random()*7){makeObstacle(z,[-1,0,1][Math.floor(Math.random()*3)]);if(Math.random()>.35)makeEnergy(z-4,[-1,0,1][Math.floor(Math.random()*3)])}let running=false,dead=false,speed=.62,targetX=0,score=0,boost=0,last=performance.now(),dragX=null;const scoreEl=document.querySelector('#score'),overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),copy=document.querySelector('#copy'),start=document.querySelector('#start');function reset(){for(const o of obstacles){o.position.z=-20-Math.random()*95;o.position.x=[-2.7,0,2.7][Math.floor(Math.random()*3)]}for(const e of energies){e.position.z=-18-Math.random()*100;e.position.x=[-2.7,0,2.7][Math.floor(Math.random()*3)]}car.position.x=targetX=0;speed=.62;score=0;boost=0;dead=false;scoreEl.textContent='0'}function begin(){reset();running=true;overlay.classList.add('hidden')}start.onclick=begin;function press(dir){targetX=Math.max(-2.7,Math.min(2.7,targetX+dir*2.7))}for(const [id,dir] of[['left',-1],['right',1]])document.querySelector('#'+id).addEventListener('pointerdown',e=>{e.preventDefault();press(dir)});document.querySelector('#boost').addEventListener('pointerdown',e=>{e.preventDefault();boost=1});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')press(-1);if(e.key==='ArrowRight'||e.key==='d')press(1);if(e.key===' '||e.key==='ArrowUp')boost=1});addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;dragX=e.clientX});addEventListener('pointerup',e=>{if(dragX===null)return;const dx=e.clientX-dragX;if(Math.abs(dx)>35)press(dx>0?1:-1);dragX=null});function crash(){running=false;dead=true;document.querySelector('#flash').classList.add('on');setTimeout(()=>document.querySelector('#flash').classList.remove('on'),180);title.innerHTML='RACE<br>OVER';copy.textContent=`${Math.floor(score)} meters. Tap below to run it again.`;start.textContent='RACE AGAIN';overlay.classList.remove('hidden')}function animate(now){requestAnimationFrame(animate);const dt=Math.min(.035,(now-last)/1000);last=now;if(running){speed=Math.min(1.55,speed+dt*.016);if(boost>0){speed=Math.min(2.05,speed+dt*1.9);boost=Math.max(0,boost-dt*.75)}score+=speed*dt*15;scoreEl.textContent=Math.floor(score);car.position.x+=(targetX-car.position.x)*Math.min(1,dt*11);car.rotation.z=(targetX-car.position.x)*-.12;for(const child of road.children){child.position.z+=speed; if(child.position.z>6)child.position.z-=102}for(const o of obstacles){o.position.z+=speed;if(o.position.z>8){o.position.z=-95-Math.random()*20;o.position.x=[-2.7,0,2.7][Math.floor(Math.random()*3)]}if(Math.abs(o.position.z-car.position.z)<1.55&&Math.abs(o.position.x-car.position.x)<1.15)crash()}for(const e of energies){e.position.z+=speed;e.rotation.z+=dt*3;if(e.position.z>8){e.position.z=-95-Math.random()*20;e.position.x=[-2.7,0,2.7][Math.floor(Math.random()*3)]}if(Math.abs(e.position.z-car.position.z)<1.3&&Math.abs(e.position.x-car.position.x)<1){score+=35;boost=Math.min(1.4,boost+.5);e.position.z=-100-Math.random()*15}}camera.position.x+=(car.position.x*.22-camera.position.x)*dt*5}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>

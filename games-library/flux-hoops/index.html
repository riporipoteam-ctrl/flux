<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Flux Hoops</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120b08;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;padding:max(14px,env(safe-area-inset-top)) 16px;pointer-events:none;display:flex;justify-content:space-between}.brand{font-size:12px;font-weight:950;letter-spacing:.18em}.brand small{display:block;color:#fb923c;font-size:9px;margin-top:4px}.score{text-align:right}.score b{font-size:30px}.score small{display:block;color:#cbd5e1}.shoot{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(76vw,330px);height:72px;border:1px solid #ffffff35;border-radius:999px;background:#f97316d9;color:#fff;font-weight:950;font-size:18px;z-index:2}.meter{position:fixed;left:50%;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 84px);transform:translateX(-50%);width:min(72vw,310px);height:12px;border-radius:999px;background:#ffffff20;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444)}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(#1c0f0888,#0f0703ef);z-index:5}.card{text-align:center;max-width:420px}.card h1{margin:0;font-size:54px;line-height:.88;letter-spacing:-.06em}.card p{color:#fed7aa;line-height:1.6}.card button{border:0;border-radius:999px;padding:16px 30px;background:#fff;color:#7c2d12;font-weight:950}.hidden{display:none}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="brand">FLUX HOOPS<small>2D STREET BASKETBALL</small></div><div class="score"><b id="score">0</b><small>POINTS</small></div></div><div class="meter"><span id="power"></span></div><button class="shoot" id="shoot">HOLD TO CHARGE · RELEASE TO SHOOT</button><div class="overlay" id="overlay"><div class="card"><h1 id="title">FLUX<br>HOOPS</h1><p id="copy">Hold to charge, release at the right power and sink clean shots. The hoop moves after every basket.</p><button id="start">PLAY BALL</button></div></div><script>const c=document.querySelector('#game'),ctx=c.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),powerEl=document.querySelector('#power'),title=document.querySelector('#title'),copy=document.querySelector('#copy'),start=document.querySelector('#start'),shoot=document.querySelector('#shoot');let w=0,h=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);let running=false,charging=false,charge=0,dir=1,score=0,shots=0,last=performance.now(),gravity=.42;const ball={x:0,y:0,vx:0,vy:0,r:18,flying:false},hoop={x:0,y:0,w:95};function resetBall(){ball.x=w*.18;ball.y=h*.72;ball.vx=ball.vy=0;ball.flying=false;charge=0;powerEl.style.width='0%'}function reset(){score=0;shots=0;hoop.x=w*.72;hoop.y=h*.35;resetBall();scoreEl.textContent='0'}start.onclick=()=>{reset();running=true;overlay.classList.add('hidden')};function beginCharge(){if(running&&!ball.flying){charging=true;dir=1}}function release(){if(!charging)return;charging=false;ball.flying=true;shots++;const angle=-.88;const force=10+charge*7;ball.vx=Math.cos(angle)*force;ball.vy=Math.sin(angle)*force;charge=0;powerEl.style.width='0%'}shoot.addEventListener('pointerdown',e=>{e.preventDefault();beginCharge()});shoot.addEventListener('pointerup',e=>{e.preventDefault();release()});shoot.addEventListener('pointercancel',release);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!charging)beginCharge()}});addEventListener('keyup',e=>{if(e.code==='Space')release()});function made(){score+=3;scoreEl.textContent=score;ball.flying=false;hoop.x=w*(.58+Math.random()*.28);hoop.y=h*(.25+Math.random()*.22);setTimeout(resetBall,350)}function miss(){ball.flying=false;setTimeout(resetBall,350)}function drawCourt(){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#28110a');g.addColorStop(.7,'#7c2d12');g.addColorStop(1,'#2b1108');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#ffffff10';for(let i=0;i<18;i++)ctx.fillRect((i*73)%w,0,2,h);ctx.strokeStyle='#ffffff25';ctx.lineWidth=3;ctx.beginPath();ctx.arc(w*.5,h*.78,w*.28,Math.PI,Math.PI*2);ctx.stroke()}function drawHoop(){ctx.strokeStyle='#e5e7eb';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(hoop.x+hoop.w*.48,hoop.y-85);ctx.lineTo(hoop.x+hoop.w*.48,hoop.y+20);ctx.stroke();ctx.fillStyle='#e5e7eb';ctx.fillRect(hoop.x+hoop.w*.35,hoop.y-82,12,80);ctx.strokeStyle='#f97316';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(hoop.x-hoop.w*.5,hoop.y);ctx.lineTo(hoop.x+hoop.w*.5,hoop.y);ctx.stroke();ctx.strokeStyle='#ffffff70';ctx.lineWidth=2;for(let i=0;i<6;i++){const xx=hoop.x-hoop.w*.42+i*hoop.w*.168;ctx.beginPath();ctx.moveTo(xx,hoop.y+3);ctx.lineTo(hoop.x+(i-2.5)*6,hoop.y+48);ctx.stroke()}ctx.beginPath();ctx.moveTo(hoop.x-hoop.w*.42,hoop.y+3);ctx.quadraticCurveTo(hoop.x,hoop.y+58,hoop.x+hoop.w*.42,hoop.y+3);ctx.stroke()}function drawBall(){ctx.save();ctx.translate(ball.x,ball.y);ctx.fillStyle='#f97316';ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3f1d0c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,ball.r*.95,-1.2,1.2);ctx.stroke();ctx.beginPath();ctx.moveTo(-ball.r,0);ctx.lineTo(ball.r,0);ctx.stroke();ctx.restore()}function loop(now){requestAnimationFrame(loop);const dt=Math.min(2,(now-last)/16.67);last=now;drawCourt();drawHoop();if(running){if(charging){charge+=dir*.018*dt;if(charge>=1){charge=1;dir=-1}if(charge<=0){charge=0;dir=1}powerEl.style.width=(charge*100)+'%'}if(ball.flying){const prevY=ball.y;ball.vy+=gravity*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const left=hoop.x-hoop.w*.5,right=hoop.x+hoop.w*.5;if(prevY<hoop.y&&ball.y>=hoop.y&&ball.vy>0&&ball.x>left+8&&ball.x<right-8){made()}else if(ball.y>h+60||ball.x>w+80||ball.x<-80)miss()}}drawBall()}requestAnimationFrame(loop);</script></body></html>

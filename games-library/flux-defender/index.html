<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Flux Defender</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;padding:max(14px,env(safe-area-inset-top)) 16px;pointer-events:none;display:flex;justify-content:space-between}.brand{font-size:12px;font-weight:950;letter-spacing:.18em}.brand small{display:block;color:#22d3ee;font-size:9px;margin-top:4px}.stats{text-align:right}.stats b{font-size:30px}.stats small{display:block;color:#94a3b8}.controls{position:fixed;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 20px;z-index:2}.pad{display:flex;gap:10px}.controls button{width:74px;height:74px;border-radius:26px;border:1px solid #ffffff2f;background:#111827cc;color:#fff;font-size:28px;font-weight:900;backdrop-filter:blur(12px)}.controls .fire{width:92px;background:#ec4899d9}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 40%,#164e63aa,#020617ee 68%);z-index:5}.card{text-align:center;max-width:420px}.card h1{margin:0;font-size:52px;line-height:.9;letter-spacing:-.06em}.card p{color:#bae6fd;line-height:1.6}.card button{border:0;border-radius:999px;padding:16px 30px;background:#fff;color:#0f172a;font-weight:950}.hidden{display:none}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="brand">FLUX DEFENDER<small>2D NEON SHOOTER</small></div><div class="stats"><b id="score">0</b><small>WAVE SCORE</small></div></div><div class="controls"><div class="pad"><button id="left">←</button><button id="right">→</button></div><button class="fire" id="fire">FIRE</button></div><div class="overlay" id="overlay"><div class="card"><h1 id="title">FLUX<br>DEFENDER</h1><p id="copy">Protect the city core. Move along the defense line, blast incoming drones and collect power cells.</p><button id="start">DEFEND</button></div></div><script>const c=document.querySelector('#game'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),title=document.querySelector('#title'),copy=document.querySelector('#copy'),start=document.querySelector('#start');let w=0,h=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);const player={x:0,y:0,w:44,h:26,speed:8};let bullets=[],enemies=[],particles=[],running=false,score=0,lives=3,last=performance.now(),spawn=0,move=0,fireHeld=false,fireDelay=0;function reset(){score=0;lives=3;bullets=[];enemies=[];particles=[];player.x=w/2;player.y=h-120;spawn=0;fireDelay=0;scoreEl.textContent='0'}start.onclick=()=>{reset();running=true;overlay.classList.add('hidden')};function setMove(v){move=v}function bind(id,v){const b=document.querySelector('#'+id);b.onpointerdown=e=>{e.preventDefault();setMove(v)};b.onpointerup=()=>setMove(0);b.onpointercancel=()=>setMove(0)}bind('left',-1);bind('right',1);const fire=document.querySelector('#fire');fire.onpointerdown=e=>{e.preventDefault();fireHeld=true};fire.onpointerup=()=>fireHeld=false;fire.onpointercancel=()=>fireHeld=false;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move=-1;if(e.key==='ArrowRight'||e.key==='d')move=1;if(e.code==='Space')fireHeld=true});addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))move=0;if(e.code==='Space')fireHeld=false});function shoot(){bullets.push({x:player.x,y:player.y-20,vy:-12,r:4})}function enemy(){const type=Math.random();enemies.push({x:30+Math.random()*(w-60),y:-40,r:type>.82?25:16,vy:2.2+Math.random()*2.4,hp:type>.82?3:1,spin:Math.random()*6,type:type>.82?'tank':'drone'})}function burst(x,y,color='#22d3ee'){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:1,color})}function gameOver(){running=false;title.innerHTML='CITY<br>OVERRUN';copy.textContent=`Score ${score}. The next defense wave is waiting.`;start.textContent='TRY AGAIN';overlay.classList.remove('hidden')}function hit(a,b,extra=0){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r+extra}function drawBackground(){const bg=g.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#020617');bg.addColorStop(.55,'#0f172a');bg.addColorStop(1,'#08111f');g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle='#22d3ee12';for(let y=0;y<h;y+=38)g.fillRect(0,y,w,1);for(let x=0;x<w;x+=48)g.fillRect(x,0,1,h);g.fillStyle='#0b1324';for(let i=0;i<16;i++){const bx=i*(w/15)-20,bh=40+(i*31)%120;g.fillRect(bx,h-85-bh,w/18+8,bh)}g.fillStyle='#22d3ee';g.fillRect(0,h-86,w,3)}function drawPlayer(){g.save();g.translate(player.x,player.y);g.fillStyle='#f8fafc';g.beginPath();g.moveTo(0,-22);g.lineTo(25,16);g.lineTo(8,10);g.lineTo(0,22);g.lineTo(-8,10);g.lineTo(-25,16);g.closePath();g.fill();g.fillStyle='#ec4899';g.fillRect(-5,8,10,17);g.restore()}function loop(now){requestAnimationFrame(loop);const dt=Math.min(2,(now-last)/16.67);last=now;drawBackground();if(running){player.x=Math.max(30,Math.min(w-30,player.x+move*player.speed*dt));fireDelay-=dt;if(fireHeld&&fireDelay<=0){shoot();fireDelay=7}spawn-=dt;if(spawn<=0){enemy();spawn=Math.max(14,45-score*.02)}for(const b of bullets)b.y+=b.vy*dt;for(const e of enemies){e.y+=e.vy*dt;e.spin+=.04*dt}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=.035*dt}for(const b of bullets){for(const e of enemies){if(!b.dead&&!e.dead&&hit(b,e)){b.dead=true;e.hp--;burst(b.x,b.y);if(e.hp<=0){e.dead=true;score+=e.type==='tank'?30:10;scoreEl.textContent=score;burst(e.x,e.y,e.type==='tank'?'#f97316':'#22d3ee')}}}}for(const e of enemies){if(!e.dead&&e.y>h-95){e.dead=true;lives--;burst(e.x,h-90,'#ef4444');if(lives<=0)gameOver()}}bullets=bullets.filter(b=>!b.dead&&b.y>-40);enemies=enemies.filter(e=>!e.dead&&e.y<h+60);particles=particles.filter(p=>p.life>0)}for(const b of bullets){g.fillStyle='#f8fafc';g.shadowColor='#22d3ee';g.shadowBlur=14;g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fill();g.shadowBlur=0}for(const e of enemies){g.save();g.translate(e.x,e.y);g.rotate(e.spin);g.fillStyle=e.type==='tank'?'#f97316':'#a855f7';g.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3,r=i%2?e.r*.62:e.r;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.restore()}for(const p of particles){g.globalAlpha=p.life;g.fillStyle=p.color;g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;drawPlayer();g.fillStyle='#fff';g.font='900 14px system-ui';g.fillText('CORE '+('♥'.repeat(Math.max(0,lives))),16,h-100)}requestAnimationFrame(loop);</script></body></html>

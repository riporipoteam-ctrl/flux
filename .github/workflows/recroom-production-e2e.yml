# Final post-deploy verification for the live Rec Room release.\nname: Rec Room Production E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recroom-production-e2e.yml"
      - "src/app/games/recroom/**"
      - "src/components/game/recroom-*.tsx"
      - "src/services/recroom-browser.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for this exact Flux Pages release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            release="$(curl -fsS -H 'Cache-Control: no-cache' "https://riporipoteam-ctrl.github.io/flux/release.json?ts=$(date +%s)" || true)"
            if [ -n "$release" ]; then
              echo "$release"
              current="$(printf '%s' "$release" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("release", ""))' 2>/dev/null || true)"
              if [ "$current" = "$EXPECTED_SHA" ]; then
                echo "Exact production release is live: $current"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Production Pages never exposed release $EXPECTED_SHA"
          exit 1
      - name: Require real Rec Room window and browser stream
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p test-results/recroom-production
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const base = 'https://riporipoteam-ctrl.github.io/flux';
            const runId = process.env.RUN_ID || String(Date.now());
            const runAttempt = process.env.RUN_ATTEMPT || '1';
            const now = String(Date.now());
            const nonce = `${runId}-${runAttempt}-${now}`;
            const email = `recroom.native.prod.${nonce}@example.com`;
            const password = `FluxNative-${runId}-${runAttempt}!Aa9`;
            const username = `rrnat${runId.slice(-6)}a${runAttempt}${now.slice(-5)}`;
            const result = {
              runId, runAttempt, email, username,
              signup: false,
              onboarding: false,
              recroomPage: false,
              runtimeReadyBeforePlay: false,
              browserOnlyUi: false,
              manualPairingRemoved: false,
              playClicked: false,
              provisioningScreen: false,
              streamStarted: false,
              runtimeBlocked: false,
              sessionError: '',
              finalBodyExcerpt: '',
              consoleErrors: [],
              fatal: '',
            };

            page.on('console', msg => {
              if (msg.type() === 'error') result.consoleErrors.push(msg.text().slice(0, 500));
            });

            try {
              await page.goto(`${base}/signup/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.locator('#name').waitFor({ state: 'visible', timeout: 30000 });
              await page.locator('#name').fill('Rec Room Native Production Player');
              await page.locator('#email').fill(email);
              await page.locator('#password').fill(password);
              await page.getByRole('button', { name: 'Create account' }).click();
              await page.waitForFunction(() => !window.location.pathname.includes('/signup'), null, { timeout: 30000 });
              result.signup = true;

              await page.goto(`${base}/onboarding/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.locator('#username').waitFor({ state: 'visible', timeout: 30000 });
              await page.locator('#username').fill(username);
              await page.getByText('Available', { exact: true }).waitFor({ state: 'visible', timeout: 30000 });
              await page.getByRole('button', { name: 'Continue' }).click();
              await page.locator('#displayName').waitFor({ state: 'visible', timeout: 15000 });
              await page.locator('#displayName').fill('Rec Room Native Production Player');
              await page.locator('#bio').fill('RipoTeamServer native Rec Room stream test.');
              await page.getByRole('button', { name: 'Continue' }).click();
              await page.locator('img[alt="Friendly Bot"]').click();
              await page.getByRole('button', { name: 'Continue' }).click();
              await page.getByText('Pick a header banner', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
              await page.getByRole('button', { name: 'Continue' }).click();
              await page.getByRole('button', { name: 'Gaming', exact: true }).click();
              await page.getByRole('button', { name: 'Continue' }).click();
              await page.getByRole('button', { name: 'Enter Flux' }).click();
              await page.waitForFunction(() => window.location.pathname.includes('/home'), null, { timeout: 30000 });
              result.onboarding = true;

              await page.goto(`${base}/games/recroom/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.getByText('Rec Room · Aug 2021').first().waitFor({ state: 'visible', timeout: 30000 });
              result.recroomPage = true;
              await page.getByText('Browser only · no download', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
              result.browserOnlyUi = true;
              result.manualPairingRemoved = (await page.getByRole('button', { name: 'Windows host setup', exact: true }).count()) === 0;
              if (!result.manualPairingRemoved) throw new Error('Legacy manual Windows-host pairing UI is still exposed.');

              for (let i = 0; i < 900; i += 1) {
                const body = await page.locator('body').innerText();
                if (body.includes('Wine sandbox ready') || body.includes('Server runtime ready')) {
                  result.runtimeReadyBeforePlay = true;
                  break;
                }
                await page.waitForTimeout(1000);
              }
              await page.screenshot({ path: 'test-results/recroom-production/01-ready-before-play.png', fullPage: true });

              const play = page.getByRole('button', { name: 'Play Rec Room', exact: true });
              await play.waitFor({ state: 'visible', timeout: 15000 });
              if (!(await play.isEnabled())) throw new Error('Play Rec Room is disabled while the exact server client is ready.');
              await play.click();
              result.playClicked = true;

              for (let i = 0; i < 240; i += 1) {
                await page.waitForTimeout(1000);
                const body = await page.locator('body').innerText();
                result.finalBodyExcerpt = body.slice(0, 1800);
                if (body.includes('RipoTeamServer · private')) result.provisioningScreen = true;
                if (body.includes('RipoTeamServer could not start Rec Room')) {
                  result.runtimeBlocked = true;
                  result.sessionError = body.match(/RipoTeamServer could not start Rec Room[\s\S]{0,1200}/)?.[0] || 'Server runtime blocked';
                  break;
                }
                if (body.includes('Rec Room · RipoTeamServer') && !body.includes('Press Play. Flux starts the game.')) {
                  result.streamStarted = true;
                  // The optimized direct-launch path can enter the live iframe
                  // before the legacy provisioning card is rendered.
                  result.provisioningScreen = true;
                  break;
                }
              }
              await page.screenshot({ path: 'test-results/recroom-production/02-native-stream.png', fullPage: true });

              if (result.runtimeBlocked) throw new Error(`Native Rec Room runtime blocked: ${result.sessionError}`);
              if (!result.streamStarted) throw new Error(`Native Rec Room stream never started. provisioning=${result.provisioningScreen}`);
            } catch (error) {
              result.fatal = String(error && error.stack || error);
              await page.screenshot({ path: 'test-results/recroom-production/failure.png', fullPage: true }).catch(() => {});
            } finally {
              fs.writeFileSync('test-results/recroom-production/result.json', JSON.stringify(result, null, 2));
              console.log(JSON.stringify(result, null, 2));
              await browser.close();
            }

            const required = result.signup && result.onboarding && result.recroomPage && result.browserOnlyUi && result.manualPairingRemoved && result.playClicked && (result.provisioningScreen || result.streamStarted) && result.streamStarted;
            if (!required || result.runtimeBlocked || result.fatal) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recroom-production-native-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/recroom-production
          if-no-files-found: warn

name: Flux 2 source snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: flux-2-source
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !out/**
          include-hidden-files: true
          retention-days: 1

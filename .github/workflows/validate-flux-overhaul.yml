name: Validate Flux

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Firebase Function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Recovery regression audit
        run: node scripts/recovery-audit.mjs

      - name: Product redesign audit
        run: node scripts/product-redesign-audit.mjs

      - name: Flux Engine 100-feature audit
        run: node scripts/flux-engine-audit.mjs

      - name: AskAI and social redesign audit
        run: node scripts/askai-social-audit.mjs

      - name: Flux V8 redesign audit
        run: node scripts/flux-v8-audit.mjs

      - name: Firebase reliability audit
        run: node scripts/firebase-reliability-audit.mjs

      - name: Platform reliability V2 audit
        run: node scripts/platform-reliability-v2-audit.mjs

      - name: Flux X V3 and Games audit
        run: node scripts/flux-x-games-v3-audit.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Firebase Functions TypeScript check
        run: npm run build --prefix functions

      - name: Production build
        run: npm run build

name: Validate Flux

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recovery regression audit
        run: node scripts/recovery-audit.mjs

      - name: Product redesign audit
        run: node scripts/product-redesign-audit.mjs

      - name: Flux Engine 100-feature audit
        run: node scripts/flux-engine-audit.mjs

      - name: AskAI and social redesign audit
        run: node scripts/askai-social-audit.mjs

      - name: Flux V2 release audit
        run: node scripts/flux-v2-release-audit.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

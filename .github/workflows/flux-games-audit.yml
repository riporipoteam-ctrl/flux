name: Flux Games Audit

on:
  pull_request:
    paths:
      - "src/app/(main)/games/**"
      - "src/app/(main)/profile/games/**"
      - "src/app/games/play/**"
      - "src/app/games/recroom/**"
      - "src/components/game/**"
      - "src/services/recroom-browser.ts"
      - "src/services/game-posts.ts"
      - "src/data/browser-games.ts"
      - "public/games-library/**"
      - "src/styles/flux-performance-x4.css"
      - "src/app/layout.tsx"
      - "scripts/flux-x-games-v3-audit.mjs"
      - ".github/workflows/flux-games-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PAGES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/flux-x-games-v3-audit.mjs
      - run: npm run lint
      - name: Exclude server-only routes from static export
        run: mv src/app/api .pages-api
      - run: npm run build
      - name: Verify static game routes
        run: |
          test -f out/games/index.html
          test -f out/games/play/index.html
          test -f out/games/recroom/index.html
          test -f out/profile/games/index.html
          test -f out/games/licenses/index.html
          test -f out/games-library/tux-racer/index.html
          test -f out/games-library/anti-gravity-pool/index.html
          test -f out/games-library/xquest/index.html
          test -f out/games-library/progress-knight/index.html
          test -f out/games-library/anxiety/index.html
          test -f out/games-library/openpanzer/index.html
          grep -R -q "echoxr-ripoteam-cloud-pc.hf.space" out/_next/static

name: Apply and verify Flux mobile upgrade

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: flux-mobile-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    if: github.head_ref == 'fix/mobile-ui-audit-20260729' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      PATCH_B64: ""
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply mobile source patch
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/mobile.patch
          git apply --check /tmp/mobile.patch
          git apply /tmp/mobile.patch

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and verify GitHub Pages export
        run: |
          trap 'if [ -d .pages-api ]; then mv .pages-api src/app/api; fi' EXIT
          mv src/app/api .pages-api
          npm run build
          test -f out/profile/index.html
          test -f out/post/index.html
          test -f out/group/index.html
          test -f out/event/index.html
          mv .pages-api src/app/api
          trap - EXIT

      - name: Commit verified mobile upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix and upgrade Flux mobile experience"
          git push origin HEAD:${{ github.head_ref }}

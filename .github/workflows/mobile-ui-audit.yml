name: Flux mobile UI audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Exclude server-only routes from static export
        run: mv src/app/api .pages-api

      - name: Build GitHub Pages export
        run: npm run build

      - name: Upload static export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-mobile-audit-out
          path: out
          if-no-files-found: ignore
          retention-days: 1

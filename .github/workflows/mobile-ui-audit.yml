name: Flux mobile UI audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ui-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Exclude server-only routes from static export
        run: mv src/app/api .pages-api

      - name: Build GitHub Pages export
        run: npm run build

      - name: Verify mobile-safe detail routes
        run: |
          test -f out/profile/index.html
          test -f out/post/index.html
          test -f out/group/index.html
          test -f out/event/index.html

name: Flux mobile UI audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: flux-source-snapshot
          path: |
            .
            !.git/**
            !node_modules/**
            !.next/**
            !out/**
          include-hidden-files: true
          retention-days: 1

name: Publish Flux Live X5

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: flux-live-x5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Prepare static-only build
        run: rm -rf src/app/api

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
          NEXT_PUBLIC_ASK_AI_ENDPOINT: ${{ vars.NEXT_PUBLIC_ASK_AI_ENDPOINT }}
          NEXT_PUBLIC_TURN_URL: ${{ vars.NEXT_PUBLIC_TURN_URL }}
          NEXT_PUBLIC_TURN_USERNAME: ${{ vars.NEXT_PUBLIC_TURN_USERNAME }}
          NEXT_PUBLIC_TURN_CREDENTIAL: ${{ secrets.NEXT_PUBLIC_TURN_CREDENTIAL }}
          NEXT_PUBLIC_RECROOM_BROKER_URL: ${{ vars.NEXT_PUBLIC_RECROOM_BROKER_URL }}
        run: npm run build

      - name: Build Rakazo guest client from open source
        env:
          RAKAZO_COMMIT: "07404f63c4ae209e9eb08b5eb004870c9f724407"
          BETTER_AUTH_SECRET: "flux-static-rakazo-build-secret-please-do-not-use-at-runtime-2026"
          ENCRYPTION_KEY: "flux-static-rakazo-encryption-key-build-only-2026"
        run: |
          set -euo pipefail
          rakazo_dir="$(mktemp -d)/rakazo"
          git clone --filter=blob:none --no-checkout https://github.com/elie222/rakazo.git "$rakazo_dir"
          git -C "$rakazo_dir" fetch --depth 1 origin "$RAKAZO_COMMIT"
          git -C "$rakazo_dir" checkout --detach "$RAKAZO_COMMIT"
          test "$(git -C "$rakazo_dir" rev-parse HEAD)" = "$RAKAZO_COMMIT"
          git -C "$rakazo_dir" apply "$GITHUB_WORKSPACE/patches/rakazo-guest-mode.patch"
          corepack enable
          cd "$rakazo_dir"
          pnpm install --frozen-lockfile
          VITE_GUEST_MODE=true VITE_BASE_PATH="/flux/rakazo/" pnpm --filter @rakazo/web build
          mkdir -p "$GITHUB_WORKSPACE/out/rakazo"
          cp -R apps/web/dist/. "$GITHUB_WORKSPACE/out/rakazo/"

      - name: Verify X5, public Live and game routes
        run: |
          set -euo pipefail

          verify_file() {
            test -f "$1" || { echo "Missing required Pages file: $1"; exit 1; }
          }

          verify_text() {
            local needle="$1"
            local path="$2"
            grep -R -q -F -- "$needle" "$path" || {
              echo "Missing required Pages marker: $needle"
              echo "Search path: $path"
              exit 1
            }
          }

          verify_absent() {
            local needle="$1"
            local path="$2"
            if grep -R -q -F -- "$needle" "$path"; then
              echo "Forbidden stale Pages marker still present: $needle"
              echo "Search path: $path"
              exit 1
            fi
          }

          verify_file out/index.html
          verify_file out/home/index.html
          verify_file out/games/index.html
          verify_file out/games/recroom/index.html
          verify_file out/games/recroom/host-pair/index.html
          verify_file out/profile/games/index.html
          verify_file out/games/licenses/index.html
          verify_file out/live/view/index.html
          verify_file out/games-library/tux-racer/index.html
          verify_file out/games-library/xquest/index.html
          verify_file out/games-library/progress-knight/index.html
          verify_file out/games-library/anxiety/index.html

          verify_text 'data-flux-ui="x5"' out
          verify_text 'Guest viewing' out/_next/static
          verify_text 'staticauth.openrelay.metered.ca' out/_next/static
          verify_text 'echoxr-ripoteam-cloud-pc.hf.space' out/_next/static
          grep -q 'createPortal' src/components/layout/mobile-nav.tsx
          verify_text 'flux-mobile-dock-portal' out/_next/static

          # Steam QR login is shown by the official Steam client inside the
          # interactive stream; do not ship the unrelated host-pairing QR as a
          # fake player-login flow.
          verify_text 'Press Play. Flux starts the game.' out/games/recroom
          verify_text 'Browser only · no download' out/games/recroom

          verify_file out/rakazo/index.html
          verify_text 'Guest mode is ready' out/rakazo
          verify_text 'Ask me anything' out/rakazo
          verify_text 'rakazo-auth' out/rakazo
          verify_text 'Computer control needs a connected Rakazo host' out/rakazo
          verify_absent 'https://app.rakazo.com/app' out/rakazo

      - name: Add release proof and no-cache fallbacks
        run: |
          touch out/.nojekyll
          cp out/index.html out/404.html
          printf '%s\n' '${{ github.sha }}' > out/version.txt
          printf '{"release":"%s","ui":"x5","live":"guest-turn-attempt-isolation","games":"self-hosted-open-source-plus-recroom-stream","recroomHost":"qr-single-use-steam-isolated","builtAt":"%s"}\n' '${{ github.sha }}' "$(date -u +%FT%TZ)" > out/release.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Publish identical fallback to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd out
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Flux ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployed release
        run: |
          echo "Flux release: ${{ github.sha }}"
          echo "Pages URL: ${{ steps.deployment.outputs.page_url }}"

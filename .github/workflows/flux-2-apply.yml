name: Apply and verify Flux 2 update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'feat/flux-2-big-update' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flux-2-big-update
      - name: Hash patch chunks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          for name in ['part-00','part-02']:
              data=Path('.github/flux2-patch/'+name).read_text()
              print(name, len(data), repr(data[:20]), repr(data[-20:]))
              for i in range(0,len(data),250):
                  print(name,i,sha256(data[i:i+250].encode()).hexdigest())
          PY
          exit 1

name: Apply and verify Flux 2 update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'feat/flux-2-big-update' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flux-2-big-update
      - name: Print mismatched ranges
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('.github/flux2-patch/part-00').read_text()
          b=Path('.github/flux2-patch/part-02').read_text()
          print('P00',repr(a[3180:3370]))
          print('P02',repr(b[4400:4830]))
          PY
          exit 1

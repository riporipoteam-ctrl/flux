name: Apply and verify Flux 2 update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: flux-2-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    if: github.head_ref == 'feat/flux-2-big-update' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Checkout Flux 2 branch
        uses: actions/checkout@v4
        with:
          ref: feat/flux-2-big-update
          fetch-depth: 0

      - name: Assemble and apply Flux 2 patch
        shell: bash
        run: |
          cat .github/flux2-patch/part-* > /tmp/flux2-patch.b64
          base64 -d /tmp/flux2-patch.b64 | gzip -d > /tmp/flux2.patch
          echo "b23de4f4a55313257a34fcbd59023788a79583efeaebc361ed7f18341e0d9d8c  /tmp/flux2.patch" | sha256sum -c -
          git apply --check /tmp/flux2.patch
          git apply /tmp/flux2.patch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and verify GitHub Pages export
        shell: bash
        run: |
          trap 'if [ -d .pages-api ]; then mv .pages-api src/app/api; fi' EXIT
          mv src/app/api .pages-api
          npm run build
          test -f out/games/index.html
          test -f out/play/index.html
          grep -q "Flux Plays" out/games/index.html

      - name: Commit verified Flux 2 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules \
            'src/app/(main)/games' \
            'src/app/(main)/home/page.tsx' \
            'src/app/(main)/layout.tsx' \
            src/app/play \
            src/app/globals.css \
            src/app/layout.tsx \
            src/components/game/flux-plays-world.tsx \
            src/components/layout/mobile-app-header.tsx \
            src/components/layout/mobile-drawer.tsx \
            src/components/layout/mobile-nav.tsx \
            src/components/layout/right-rail.tsx \
            src/components/layout/sidebar.tsx \
            src/components/ui/button.tsx \
            src/components/ui/tabs.tsx \
            src/services/flux-plays.ts \
            src/types/index.ts
          git commit -m "Release Flux 2.0 and Flux Plays"
          git push origin HEAD:feat/flux-2-big-update

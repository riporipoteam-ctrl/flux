name: Apply and verify Flux 2 update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'feat/flux-2-big-update' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flux-2-big-update
      - name: Print exact mismatch
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('.github/flux2-patch/part-00').read_text()
          print(repr(a[3340:3425]))
          print([(i,a[i]) for i in range(3340,3425)])
          PY
          exit 1

name: Apply and verify Flux 2 update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: flux-2-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    if: github.head_ref == 'feat/flux-2-big-update' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Checkout Flux 2 branch
        uses: actions/checkout@v4
        with:
          ref: feat/flux-2-big-update
          fetch-depth: 0

      - name: Inspect staged Flux 2 patch
        shell: bash
        run: |
          wc -c .github/flux2-patch/part-*
          cat .github/flux2-patch/part-* > /tmp/flux2-patch.b64
          wc -c /tmp/flux2-patch.b64
          sha256sum /tmp/flux2-patch.b64
          python - <<'PY'
          from pathlib import Path
          data=Path('/tmp/flux2-patch.b64').read_text()
          bad=[(i,c) for i,c in enumerate(data) if c not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\n\r']
          print('bad-count',len(bad),'first',bad[:10])
          PY
          exit 1

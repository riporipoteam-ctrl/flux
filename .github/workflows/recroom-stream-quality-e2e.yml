# Manual post-deploy verification trigger for MP3 audio, serialized input, and rendered frames.\nname: Rec Room Stream Quality E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recroom-stream-quality-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove native Rec Room video audio and input
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p test-results/recroom-stream-quality
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const crypto = require('crypto');
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            const base = 'https://riporipoteam-ctrl.github.io/flux';
            const nonce = `${process.env.RUN_ID}-${process.env.RUN_ATTEMPT}-${Date.now()}`;
            const email = `rr.quality.${nonce}@example.com`;
            const password = `RRQuality-${nonce}!Aa9`;
            const username = `rrq${String(Date.now()).slice(-12)}`.slice(0, 20);
            const result = {
              signup: false, onboarding: false, runtimeReady: false, playClicked: false,
              streamShell: false, iframeLoaded: false, directStreamLoaded: false, frameLoaded: false,
              frameWidth: 0, frameHeight: 0, frameBrightness: 0, frameVariance: 0,
              frameSha256: '', observedFrames: 0, observedFps: 0, streamConnected: false, audioHealth: false,
              audioBytes: 0, audioMp3: false, audioOgg: false, audioElementLinked: false, inputDown: false, inputUp: false,
              finalStreamStatus: '', runtimeError: '', fatal: '',
            };

            try {
              await page.goto(`${base}/signup/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.locator('#name').fill('Rec Room Stream Quality');
              await page.locator('#email').fill(email);
              await page.locator('#password').fill(password);
              await page.getByRole('button', { name: 'Create account' }).click();
              await page.waitForFunction(() => !location.pathname.includes('/signup'), null, { timeout: 30000 });
              result.signup = true;

              await page.goto(`${base}/onboarding/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.locator('#username').waitFor({ state: 'visible', timeout: 30000 });
              await page.locator('#username').fill(username);
              await page.getByText('Available', { exact: true }).waitFor({ state: 'visible', timeout: 30000 });
              await page.getByRole('button', { name: 'Continue' }).click();
              await page.locator('#displayName').fill('Rec Room Stream Quality');
              await page.locator('#bio').fill('Native stream quality verification.');
              await page.getByRole('button', { name: 'Continue' }).click();
              await page.locator('img[alt="Friendly Bot"]').click();
              await page.getByRole('button', { name: 'Continue' }).click();
              await page.getByText('Pick a header banner', { exact: true }).waitFor({ state: 'visible', timeout: 15000 });
              await page.getByRole('button', { name: 'Continue' }).click();
              await page.getByRole('button', { name: 'Gaming', exact: true }).click();
              await page.getByRole('button', { name: 'Continue' }).click();
              await page.getByRole('button', { name: 'Enter Flux' }).click();
              await page.waitForFunction(() => location.pathname.includes('/home'), null, { timeout: 30000 });
              result.onboarding = true;

              await page.goto(`${base}/games/recroom/`, { waitUntil: 'domcontentloaded', timeout: 60000 });
              for (let i = 0; i < 90; i++) {
                const body = await page.locator('body').innerText();
                if (body.includes('Wine sandbox ready') || body.includes('Server runtime ready')) { result.runtimeReady = true; break; }
                await sleep(1000);
              }
              if (!result.runtimeReady) throw new Error('RipoTeamServer exact Rec Room runtime never became ready.');

              const play = page.getByRole('button', { name: 'Play Rec Room', exact: true });
              await play.waitFor({ state: 'visible', timeout: 15000 });
              await play.click(); result.playClicked = true;

              let directStream = false;
              let frame = null;
              let directFrame = null;
              let directEndpoints = null;

              for (let i = 0; i < 210; i++) {
                await sleep(1000);
                const body = await page.locator('body').innerText();
                if (body.includes('RipoTeamServer could not start Rec Room')) {
                  result.runtimeError = body.match(/RipoTeamServer could not start Rec Room[\s\S]{0,1400}/)?.[0] || body.slice(0, 1400);
                  throw new Error(result.runtimeError);
                }
                const directCount = await page.locator('img[alt="Rec Room streamed from RipoTeamServer"]').count();
                const iframeCount = await page.locator('iframe[title="Rec Room · RipoTeamServer"]').count();
                if (directCount > 0 || iframeCount > 0) {
                  result.streamShell = true;
                  directStream = directCount > 0;
                  break;
                }
              }
              if (!result.streamShell) throw new Error('Flux never received the Rec Room stream URL.');

              if (directStream) {
                // The optimized player renders the relay directly in Flux. It
                // intentionally has no iframe, so verify the actual JPEG relay.
                directFrame = page.locator('img[alt="Rec Room streamed from RipoTeamServer"]');
                await directFrame.waitFor({ state: 'visible', timeout: 30000 });
                result.directStreamLoaded = true;
                const initialSrc = await directFrame.getAttribute('src');
                if (!initialSrc) throw new Error('Rec Room direct stream image did not receive a frame URL.');
                const parsed = new URL(initialSrc, page.url());
                const token = parsed.searchParams.get('token') || '';
                const slash = parsed.pathname.lastIndexOf('/');
                if (slash < 0) throw new Error('Rec Room direct stream URL has no endpoint directory.');
                const baseUrl = parsed.origin + parsed.pathname.slice(0, slash + 1);
                const endpoint = name => {
                  const next = new URL(name, baseUrl);
                  if (token) next.searchParams.set('token', token);
                  return next.toString();
                };
                directEndpoints = {
                  frameUrl: endpoint('frame.jpg'),
                  healthUrl: endpoint('health'),
                  inputUrl: endpoint('input'),
                  audioUrl: endpoint('audio.mp3'),
                };

                const sampleFrame = async () => page.evaluate(async url => {
                  try {
                    const next = new URL(url);
                    next.searchParams.set('e2e', String(Date.now()));
                    const response = await fetch(next.toString(), { cache: 'no-store' });
                    if (!response.ok) return null;
                    const blob = await response.blob();
                    const bitmap = await createImageBitmap(blob);
                    const sourceWidth = bitmap.width;
                    const sourceHeight = bitmap.height;
                    const canvas = document.createElement('canvas');
                    canvas.width = 64; canvas.height = 36;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    if (!ctx) return null;
                    ctx.drawImage(bitmap, 0, 0, 64, 36);
                    const d = ctx.getImageData(0, 0, 64, 36).data;
                    let sum = 0, sum2 = 0, n = 0;
                    for (let p = 0; p < d.length; p += 4) {
                      const y = (d[p] + d[p + 1] + d[p + 2]) / 3;
                      sum += y; sum2 += y * y; n++;
                    }
                    bitmap.close?.();
                    const mean = sum / n;
                    return {
                      width: 64,
                      height: 36,
                      sourceWidth,
                      sourceHeight,
                      mean,
                      variance: sum2 / n - mean * mean,
                    };
                  } catch {
                    return null;
                  }
                }, directEndpoints.frameUrl);

                for (let i = 0; i < 120; i++) {
                  await sleep(1000);
                  const sample = await sampleFrame();
                  const lines = (await page.locator('body').innerText()).split(/\r?\n/);
                  result.finalStreamStatus = lines.find(line => line.startsWith('Connected ·')) || '';
                  if (sample) {
                    result.frameLoaded = true;
                    result.frameWidth = sample.sourceWidth || sample.width;
                    result.frameHeight = sample.sourceHeight || sample.height;
                    result.frameBrightness = Number(sample.mean.toFixed(2));
                    result.frameVariance = Number(sample.variance.toFixed(2));
                    if (result.finalStreamStatus.startsWith('Connected') && (sample.mean > 2 || sample.variance > 4)) {
                      result.streamConnected = true;
                      break;
                    }
                  }
                }
                if (!result.frameLoaded) throw new Error('No JPEG frame ever loaded from the Rec Room direct stream.');
                if (!result.streamConnected) {
                  throw new Error(
                    'Rec Room frame stayed black/unconnected: status=' + result.finalStreamStatus +
                    ' brightness=' + result.frameBrightness +
                    ' variance=' + result.frameVariance
                  );
                }

                // Count fresh frame URLs for five seconds. The relay captures at
                // 12 FPS and the browser pump targets roughly the same cadence.
                const observation = await page.evaluate(async () => {
                  const image = document.querySelector('img[alt="Rec Room streamed from RipoTeamServer"]');
                  if (!image) return { changes: 0, seconds: 0 };
                  let changes = 0;
                  const observer = new MutationObserver(records => {
                    changes += records.filter(record => record.attributeName === 'src').length;
                  });
                  observer.observe(image, { attributes: true, attributeFilter: ['src'] });
                  const started = performance.now();
                  await new Promise(resolve => setTimeout(resolve, 3000));
                  observer.disconnect();
                  return { changes, seconds: (performance.now() - started) / 1000 };
                });
                result.observedFrames = observation.changes;
                result.observedFps = Number((observation.changes / Math.max(1, observation.seconds)).toFixed(2));
                if (result.observedFps < 2.5) {
                  throw new Error('Rec Room direct stream is too slow: observed ' + result.observedFps + ' FPS.');
                }
              } else {
                const iframe = page.locator('iframe[title="Rec Room · RipoTeamServer"]');
                await iframe.waitFor({ state: 'visible', timeout: 30000 });
                const frameHandle = await iframe.elementHandle();
                frame = await frameHandle.contentFrame();
                if (!frame) throw new Error('Rec Room stream iframe did not create a browsing context.');
                await frame.waitForLoadState('domcontentloaded', { timeout: 30000 });
                result.iframeLoaded = true;
                await frame.locator('#frame').waitFor({ state: 'visible', timeout: 30000 });

                // Legacy stream path: wait up to two minutes for a real
                // rendered game frame, not only a visible Wine window.
                for (let i = 0; i < 120; i++) {
                  await sleep(1000);
                  const sample = await frame.locator('#frame').evaluate(img => {
                    if (!img.complete || !img.naturalWidth || !img.naturalHeight) return null;
                    const canvas = document.createElement('canvas');
                    canvas.width = 64; canvas.height = 36;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0, 64, 36);
                    const d = ctx.getImageData(0, 0, 64, 36).data;
                    let sum=0, sum2=0, n=0;
                    for (let p=0; p<d.length; p+=4) {
                      const y=(d[p]+d[p+1]+d[p+2])/3;
                      sum+=y; sum2+=y*y; n++;
                    }
                    const mean=sum/n; const variance=sum2/n-mean*mean;
                    return { width: img.naturalWidth, height: img.naturalHeight, mean, variance };
                  }).catch(() => null);
                  if (sample) {
                    result.frameLoaded = true;
                    result.frameWidth = sample.width; result.frameHeight = sample.height;
                    result.frameBrightness = Number(sample.mean.toFixed(2));
                    result.frameVariance = Number(sample.variance.toFixed(2));
                    result.finalStreamStatus = await frame.locator('#status').innerText().catch(() => '');
                    if (result.finalStreamStatus.startsWith('Connected') && (sample.mean > 2 || sample.variance > 4)) {
                      result.streamConnected = true; break;
                    }
                  }
                }
                if (!result.frameLoaded) throw new Error('No JPEG frame ever loaded from the Rec Room Wine display.');
                if (!result.streamConnected) {
                  throw new Error(
                    'Rec Room frame stayed black/unconnected: status=' + result.finalStreamStatus +
                    ' brightness=' + result.frameBrightness +
                    ' variance=' + result.frameVariance
                  );
                }
              }

              const frameBytes = directStream
                ? await page.evaluate(async url => {
                    const next = new URL(url);
                    next.searchParams.set('e2e', String(Date.now()));
                    const response = await fetch(next.toString(), { cache: 'no-store' });
                    if (!response.ok) throw new Error('frame HTTP ' + response.status);
                    return Array.from(new Uint8Array(await response.arrayBuffer()));
                  }, directEndpoints.frameUrl)
                : await frame.evaluate(async () => {
                    const token = new URL(location.href).searchParams.get('token') || '';
                    const r = await fetch('frame.jpg?token=' + encodeURIComponent(token) + '&e2e=' + Date.now(), { cache: 'no-store' });
                    if (!r.ok) throw new Error('frame HTTP ' + r.status);
                    return Array.from(new Uint8Array(await r.arrayBuffer()));
                  });
              result.frameSha256 = crypto.createHash('sha256').update(Buffer.from(frameBytes)).digest('hex');

              const health = directStream
                ? await page.evaluate(async url => {
                    const next = new URL(url);
                    next.searchParams.set('e2e', String(Date.now()));
                    const r = await fetch(next.toString(), { cache: 'no-store' });
                    return r.ok ? await r.json() : { ok:false, status:r.status };
                  }, directEndpoints.healthUrl)
                : await frame.evaluate(async () => {
                    const r = await fetch('health?e2e=' + Date.now(), { cache: 'no-store' });
                    return r.ok ? await r.json() : { ok:false, status:r.status };
                  });
              result.audioHealth = health.ok === true && health.audio === true;
              if (!result.audioHealth) throw new Error('Stream health did not expose audio: ' + JSON.stringify(health));

              const inputResult = directStream
                ? await page.evaluate(async url => {
                    const send = async down => {
                      const next = new URL(url);
                      const r = await fetch(next.toString(), {
                        method:'POST', headers:{'content-type':'application/json'},
                        body:JSON.stringify({type:'key',key:'w',down}), cache:'no-store'
                      });
                      return { status:r.status, body:await r.json().catch(()=>({})) };
                    };
                    const down = await send(true); await new Promise(r=>setTimeout(r,350)); const up = await send(false);
                    return { down, up };
                  }, directEndpoints.inputUrl)
                : await frame.evaluate(async () => {
                    const token = new URL(location.href).searchParams.get('token') || '';
                    const send = async (down) => {
                      const r = await fetch('input?token=' + encodeURIComponent(token), {
                        method:'POST', headers:{'content-type':'application/json'},
                        body:JSON.stringify({type:'key',key:'w',down}), cache:'no-store'
                      });
                      return { status:r.status, body:await r.json().catch(()=>({})) };
                    };
                    const down = await send(true); await new Promise(r=>setTimeout(r,350)); const up = await send(false);
                    return { down, up };
                  });
              result.inputDown = inputResult.down.status === 200 && inputResult.down.body.ok === true;
              result.inputUp = inputResult.up.status === 200 && inputResult.up.body.ok === true;
              if (!result.inputDown || !result.inputUp) throw new Error('Keyboard input delivery failed: ' + JSON.stringify(inputResult));

              // Read the beginning of the live MP3 audio stream. MP3
              // headers are emitted even if the current game moment is quiet.
              const audio = directStream
                ? await page.evaluate(async url => {
                    const next = new URL(url);
                    next.searchParams.set('e2e', String(Date.now()));
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 30000);
                    try {
                      const r = await fetch(next.toString(), { signal:controller.signal, cache:'no-store' });
                      if (!r.ok || !r.body) return { ok:false, status:r.status, bytes:[] };
                      const reader = r.body.getReader(); const parts=[]; let total=0;
                      while (total < 4096) {
                        const {value,done}=await reader.read(); if (done) break;
                        if (value) { parts.push(...Array.from(value.slice(0, Math.min(value.length,4096-total)))); total+=Math.min(value.length,4096-total); }
                      }
                      controller.abort(); return {ok:true,status:r.status,bytes:parts};
                    } catch (e) { return {ok:false,error:String(e),bytes:[]}; }
                    finally { clearTimeout(timer); }
                  }, directEndpoints.audioUrl)
                : await frame.evaluate(async () => {
                    const token = new URL(location.href).searchParams.get('token') || '';
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 12000);
                    try {
                      const r = await fetch('audio.ogg?token=' + encodeURIComponent(token) + '&e2e=' + Date.now(), { signal:controller.signal, cache:'no-store' });
                      if (!r.ok || !r.body) return { ok:false, status:r.status, bytes:[] };
                      const reader = r.body.getReader(); const parts=[]; let total=0;
                      while (total < 4096) {
                        const {value,done}=await reader.read(); if (done) break;
                        if (value) { parts.push(...Array.from(value.slice(0, Math.min(value.length,4096-total)))); total+=Math.min(value.length,4096-total); }
                      }
                      controller.abort(); return {ok:true,status:r.status,bytes:parts};
                    } catch (e) { return {ok:false,error:String(e),bytes:[]}; }
                    finally { clearTimeout(timer); }
                  });
              result.audioBytes = audio.bytes.length;
              const audioHeader = audio.bytes.slice(0, 4);
              result.audioMp3 = audio.bytes.length >= 2 && (
                (audioHeader[0] === 0x49 && audioHeader[1] === 0x44) ||
                (audioHeader[0] === 0xff && (audioHeader[1] & 0xe0) === 0xe0)
              );
              result.audioOgg = audio.bytes.length >= 4 && String.fromCharCode(...audioHeader) === 'OggS';
              const audioElements = await page.locator('audio').evaluateAll(elements => elements.map(audio => ({
                src: audio.currentSrc || audio.src || '',
                networkState: audio.networkState,
                readyState: audio.readyState,
              }))).catch(() => []);
              result.audioElementLinked = audioElements.some(audio => Boolean(audio.src));
              if (!result.audioMp3) {
                throw new Error(
                  'Live audio did not return MP3 bytes: ' +
                  JSON.stringify({
                    ok:audio.ok,
                    status:audio.status,
                    error:audio.error,
                    bytes:audio.bytes.length,
                    audioElements
                  })
                );
              }
              await page.screenshot({ path: 'test-results/recroom-stream-quality/playable.png', fullPage: true });
            } catch (error) {
              result.fatal = String(error && error.stack || error);
              await page.screenshot({ path: 'test-results/recroom-stream-quality/failure.png', fullPage: true }).catch(()=>{});
            } finally {
              fs.writeFileSync('test-results/recroom-stream-quality/result.json', JSON.stringify(result, null, 2));
              console.log(JSON.stringify(result, null, 2));
              await browser.close();
            }
            const ok = result.signup && result.onboarding && result.runtimeReady && result.playClicked && result.streamShell && (result.iframeLoaded || result.directStreamLoaded) && result.frameLoaded && result.streamConnected && result.audioHealth && result.audioMp3 && result.inputDown && result.inputUp && !result.runtimeError && !result.fatal;
            if (!ok) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recroom-stream-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/recroom-stream-quality
          if-no-files-found: warn

name: Sync Rec Room backend to Hugging Face

on:
  workflow_dispatch:
  push:
    paths:
      - "ops/recroom-space-patch/**"
      - ".github/workflows/sync-recroom-space.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Flux
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub client
        run: python -m pip install --disable-pip-version-check huggingface_hub

      - name: Upload direct-launch backend patch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: Echoxr/ripoteam-cloud-pc
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::The HF_TOKEN GitHub Actions secret is missing. Add a Hugging Face token with write access to the Space."
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import CommitOperationAdd, HfApi

          files = [
              ("ops/recroom-space-patch/README.md", "README.md"),
              ("ops/recroom-space-patch/recroom_autoload.py", "recroom_autoload.py"),
              ("ops/recroom-space-patch/recroom_black_viewport_fix.py", "recroom_black_viewport_fix.py"),
              ("ops/recroom-space-patch/recroom_vm_bridge.py", "recroom_vm_bridge.py"),
              ("ops/recroom-space-patch/recroom_wine_pool.py", "recroom_wine_pool.py"),
              ("ops/recroom-space-patch/recroom_wine_runtime_fix.py", "recroom_wine_runtime_fix.py"),
          ]
          api = HfApi(token=os.environ["HF_TOKEN"])
          operations = [
              CommitOperationAdd(path_in_repo=target, path_or_fileobj=source)
              for source, target in files
          ]
          commit = api.create_commit(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              operations=operations,
              commit_message="Launch Rec Room directly without Steam",
          )
          print(f"Published {commit.commit_url or commit.oid}")
          PY

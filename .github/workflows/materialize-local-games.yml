name: Materialize local Flux games

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - scripts/vendor-local-games.sh
      - .github/workflows/vendor-local-games.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: materialize-local-games-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/local-flux-games'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Vendor games into Flux
        run: bash scripts/vendor-local-games.sh

      - name: Install and verify Flux
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Verify every game is local
        run: |
          for game in tux-racer anti-gravity-pool xquest openpanzer progress-knight anxiety; do
            test -f "public/games-library/$game/index.html"
          done
          ! grep -Eq 'window\.open\(game\.playUrl|src=\{game\.playUrl\}' src/components/game/browser-game-shell.tsx
          ! grep -Eq 'playUrl: "https?://' src/data/browser-games.ts

      - name: Commit generated games to the pull-request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games-library src/data/browser-games.ts src/components/game/browser-game-shell.tsx 'src/app/(main)/games/page.tsx'
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Host browser games directly inside Flux"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
